version: 2

models:
  - name: stg_brands
    description: Cleaned brand list from seed data.
    columns:
      - name: brand
        tests: [not_null, unique]
      - name: segment
        tests: [not_null]
      - name: industry
        tests: [not_null]

  - name: dim_brand
    description: Brand dimension used for joining ad facts to Enterprise vs Startup segment.
    columns:
      - name: brand_key
        tests: [not_null, unique]
      - name: brand
        tests: [not_null]

  - name: mart_brand_weekly_strategy
    description: Weekly strategy KPIs per brand (scaffold until ads data is loaded).
